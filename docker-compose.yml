version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moringa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moringa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moringa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./adonis-backend-new
      dockerfile: Dockerfile
    container_name: moringa-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/moringa_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./adonis-backend-new/uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && node server.js"
    restart: unless-stopped

  frontend:
    build:
      context: ./next-Frontend-new
      dockerfile: Dockerfile
    container_name: moringa-frontend
    ports:
      - "5173:5173"
    environment:
      PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
