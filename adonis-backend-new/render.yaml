services:
  - type: web
    name: moringa-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: moringa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: moringa-redis
          property: connectionString

databases:
  - name: moringa-db
    plan: starter
